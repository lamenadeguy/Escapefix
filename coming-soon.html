<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="initial-scale=1">
		<title>TheKuzzy.win</title>
		<link href="/static/css/default.css" type="text/css" rel="stylesheet">
		<style>
			html, body {
				height: 100%;
				margin: 0;
				background-color: #14171c;
			}
			.soon-wrap {
				min-height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 40px 20px;
				box-sizing: border-box;
			}
			.soon-wrap img {
				width: 140px;
				height: 140px;
				object-fit: contain;
				margin-bottom: 30px;
			}
			.soon-wrap h1 {
				font-size: 28px;
				margin: 0 0 12px;
				color: #FF6600;
			}
			.soon-wrap p {
				font-size: 16px;
				max-width: 480px;
				margin: 0 0 22px;
				color: #FF6600;
			}
			.soon-wrap a.tg-link {
				display: inline-block;
				padding: 10px 22px;
				border-radius: 8px;
				background-color: transparent;
				border: 1px solid #FF6600;
				color: #FF6600;
				text-decoration: none;
				font-size: 15px;
			}
			.soon-wrap a.tg-link:hover {
				background-color: #FF6600;
				color: #14171c;
			}
		</style>
	</head>
	<body>
		<div class="soon-wrap">
			<img src="/static/img/logo.png" alt="TheKuzzy.win">
			<h1>TheKuzzy.win</h1>
			<p>The site will be opening soon. Check back shortly.</p>
			<a class="tg-link" href="https://t.me/kuzzykins" target="_blank">Check Telegram channel for any updates</a>
		</div>
	</body>
</html>
